[tool.uv.workspace]
members = ["backend", "frontend-tui"]

[tool.ruff]
target-version = "py314"
src = ["backend/src", "frontend-tui/src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the point of tests. PLR2004: literal expecteds are clearer inline.
# SLF001: tests may reach into internals. INP001: tests use importlib mode, no __init__.
"**/tests/**" = ["S101", "PLR2004", "SLF001", "INP001"]

[tool.ty.environment]
root = ["backend/src", "frontend-tui/src", "."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["backend/tests", "frontend-tui/tests", "tools/tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipython>=9.14.1",
    "prek>=0.4.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]
