# Stage-1 Scenario: a triangular-prism Location Graph.
#
# Two triangles (Paris—Rome—Madrid, Berlin—London—Oslo) connected by three rungs
# (Paris—Berlin, Rome—London, Madrid—Oslo). Each Location has exactly three
# neighbours, making every self-avoiding walk from any starting point reachable.
#
# Connections are authored as undirected pairs; the loader expands them symmetrically.
# The Escape Location has no connections and is never a neighbour.

name = "minimal"

connections = [
  ["paris",  "rome"],
  ["rome",   "madrid"],
  ["madrid", "paris"],
  ["berlin", "london"],
  ["london", "oslo"],
  ["oslo",   "berlin"],
  ["paris",  "berlin"],
  ["rome",   "london"],
  ["madrid", "oslo"],
]

[[locations]]
id = "paris"
name = "Paris"
stage = 0

[[locations]]
id = "rome"
name = "Rome"
stage = 0

[[locations]]
id = "madrid"
name = "Madrid"
stage = 0

[[locations]]
id = "berlin"
name = "Berlin"
stage = 0

[[locations]]
id = "london"
name = "London"
stage = 0

[[locations]]
id = "oslo"
name = "Oslo"
stage = 0

[[locations]]
id = "escape"
name = "Escape"
stage = 0
escape = true
