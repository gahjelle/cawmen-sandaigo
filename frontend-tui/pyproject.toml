[project]
name = "cawmen-tui"
version = "0.0.0"
description = "Textual terminal client for Cawmen Sandaigo: a thin REST client of the backend."
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.16.1",
    "httpx>=0.28.1",
    "textual>=8.2.7",
]

[project.scripts]
cawmen-tui = "cawmen_tui.__main__:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cawmen_tui"
module-root = "src"

[tool.uv.sources]
cawmen-backend = { workspace = true }

[dependency-groups]
dev = [
    "cawmen-backend",
    "pytest-textual-snapshot>=1.0.0",
]
