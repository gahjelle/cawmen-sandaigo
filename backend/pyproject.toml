[project]
name = "cawmen-backend"
version = "0.0.0"
description = "Authoritative backend for Cawmen Sandaigo: game state, chase mechanics, REST API."
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.16.1",
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "uvicorn>=0.49.0",
]

[project.scripts]
cawmen-backend = "cawmen_backend.__main__:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cawmen_backend"
module-root = "src"
